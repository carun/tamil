<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>பக்கம் கிடைக்கவில்லை · தமிழில் தியான நூல்கள்</title>
<link rel="icon" href="/_static/dharma-wheel.png">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #4493f8; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 0 16px; box-sizing: border-box; text-align: center; line-height: 1.6;
  }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
  p { color: var(--muted); margin: 0.25rem 0; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <img src="/_static/dharma-wheel.png" alt="">
  <h1>பக்கம் கிடைக்கவில்லை</h1>
  <p>நீங்கள் தேடிய பக்கம் இங்கு இல்லை.</p>
  <p><a href="/">முகப்புப் பக்கத்திற்குச் செல்லுங்கள்</a></p>
</main>
</body>
</html>
