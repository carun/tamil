# Builds the site (HTML + PDFs) and deploys it to https://tamil.arunc.dev on
# every push to main, by running scripts/deploy.sh: the same script used for a
# manual deploy from your own machine.
#
# Needs the repo secret CLOUDFLARE_API_TOKEN: a Cloudflare API token that can
# deploy Workers and manage the tamil.arunc.dev custom domain on the arunc.dev
# zone. The account is pinned in wrangler.jsonc.
#
# Tool versions are pinned here so a new upstream release can't break a deploy
# unannounced. Bump them deliberately.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A push during a running deploy waits, then deploys the
# newest commit, so an older build never lands after a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PANDOC_VERSION: "3.9"
  TYPST_VERSION: "0.15.1"
  WRANGLER_VERSION: "4.158.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r requirements.txt

      # Ubuntu's packaged pandoc is too old for the Typst writer.
      - name: Install pandoc and typst
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            | tar xz --strip-components=2 -C "$RUNNER_TEMP/bin" "pandoc-${PANDOC_VERSION}/bin/pandoc"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar xJ --strip-components=1 -C "$RUNNER_TEMP/bin" typst-x86_64-unknown-linux-musl/typst
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install wrangler
        run: npm install --global "wrangler@${WRANGLER_VERSION}"

      - name: Build and deploy
        run: ./scripts/deploy.sh
        env:
          VENV: ${{ runner.temp }}/venv
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
