# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The site moved to https://tamil.arunc.dev (Cloudflare static assets, deployed
# with scripts/deploy.sh). Read the Docs still builds on every push, but it
# publishes only redirect stubs, so old tamil.rtfd.io links reach the same page
# at the new address. See scripts/rtd_redirects.py.

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  commands:
    - python3 scripts/rtd_redirects.py "$READTHEDOCS_OUTPUT/html"
